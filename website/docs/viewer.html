<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scala miniKanren Docs Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <main class="shell page-stack docs-viewer-shell">
    <header class="page-header">
      <a class="back-link" href="index.html">Docs</a>
      <h1 id="doc-title">Documentation</h1>
      <p id="doc-path" class="mono subtle"></p>
    </header>

    <article class="card markdown-card" id="markdown-root">
      <p>Loading documentation...</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    window.SitePages.renderMarkdownDocument({
      titleElement: document.getElementById('doc-title'),
      pathElement: document.getElementById('doc-path'),
      rootElement: document.getElementById('markdown-root')
    });
  </script>
</body>
</html>
