name: CI

on:
  push:
    branches:
      - master
      - cleanup
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12.21", "2.13.18"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Install sbt (via SDKMAN)
        run: |
          curl -s "https://get.sdkman.io" | bash
          # initialize sdkman in this shell
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          # install the default/latest sbt (change to a pinned version if you prefer)
          sdk install sbt

      - name: Build, test, docs, and mdoc
        run: >-
          sbt -v ++${{ matrix.scala }} clean doc coverage test miniKanrenExamplesJVM/mdoc coverageReport coverageAggregate

      - name: Upload coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: sbt -v ++2.12.21 coveralls
