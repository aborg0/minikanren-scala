name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install sbt via coursier
        run: |
          curl -fLo cs https://git.io/coursier-cli
          chmod +x cs
          ./cs install sbt
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify sbt is available
        run: |
          echo "PATH=$PATH"
          which sbt || true
          sbt --version

      - name: Run sbt tests
        run: sbt test
