name: CI

on:
  push:
    branches:
      - master
      - cleanup
  pull_request:
    branches:
      - master
      - cleanup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12.21", "2.13.18", "3.8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install sbt via coursier
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fLo "$HOME/.local/bin/cs" https://git.io/coursier-cli
          chmod +x "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$PATH:$HOME/.local/share/coursier/bin"
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
          cs install sbt || ~/.local/bin/cs install sbt

      - name: Verify sbt is available
        run: |
          echo "PATH=$PATH"
          which sbt || true
          sbt --version

      - name: Cache sbt and ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            ~/.coursier/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/plugins.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build JVM targets (Scala 2.x)
        if: matrix.scala != '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++${{ matrix.scala }} clean miniKanrenJVM/doc coverage miniKanrenJVM/test miniKanrenExamplesJVM/mdoc miniKanrenJVM/coverageReport

      - name: Build Scala 3 JVM modules
        if: matrix.scala == '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 clean miniKanrenJVM/doc coverage miniKanrenJVM/test miniKanrenExamplesJVM/mdoc miniKanrenScala3DSLCrossJVM/test miniKanrenLangCrossJVM/test coverageAggregate

      - name: Build and test Scala.js targets
        if: matrix.scala == '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 miniKanrenJS/test miniKanrenExamplesJS/test miniKanrenScala3DSLCrossJS/test miniKanrenLangCrossJS/test miniKanrenWebsite/fullLinkJS

      - name: Upload coverage to Coveralls
        if: matrix.scala == '3.8.3' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cleanup')
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 coveralls

      - name: Publish snapshot artifacts (Scala 2.x JVM + JS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/cleanup' && matrix.scala != '3.8.3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISH_VERSION: "0.1.${{ github.run_number }}-SNAPSHOT"
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++${{ matrix.scala }} miniKanrenJVM/publish miniKanrenJS/publish

      - name: Publish snapshot artifacts (Scala 3 JVM + JS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/cleanup' && matrix.scala == '3.8.3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISH_VERSION: "0.1.${{ github.run_number }}-SNAPSHOT"
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 miniKanrenJVM/publish miniKanrenJS/publish miniKanrenScala3DSLCrossJVM/publish miniKanrenScala3DSLCrossJS/publish miniKanrenLangCrossJVM/publish miniKanrenLangCrossJS/publish

  pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cleanup')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install sbt via coursier
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fLo "$HOME/.local/bin/cs" https://git.io/coursier-cli
          chmod +x "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$PATH:$HOME/.local/share/coursier/bin"
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
          cs install sbt || ~/.local/bin/cs install sbt

      - name: Check Pages API access
        id: pages_access
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              })
              core.setOutput('enabled', 'true')
            } catch (e) {
              core.warning(`Pages API unavailable for this token: ${e.message}`)
              core.setOutput('enabled', 'false')
            }

      - name: Configure Pages
        if: steps.pages_access.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build static site artifact
        run: bash ./scripts/build-site.sh

      - name: Upload Pages artifact
        if: steps.pages_access.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        if: steps.pages_access.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Pages deploy skipped
        if: steps.pages_access.outputs.enabled != 'true'
        run: |
          echo "Skipping GitHub Pages deploy: this workflow token cannot access repository Pages settings."
          echo "Enable Pages once in repository settings (Build and deployment: GitHub Actions) to allow deployments."
