name: CI

on:
  push:
    branches:
      - master
      - cleanup
  pull_request:
    branches:
      - master
      - cleanup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12.21", "2.13.18", "3.8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install sbt via coursier
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fLo "$HOME/.local/bin/cs" https://git.io/coursier-cli
          chmod +x "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$PATH:$HOME/.local/share/coursier/bin"
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
          cs install sbt || ~/.local/bin/cs install sbt

      - name: Verify sbt is available
        run: |
          echo "PATH=$PATH"
          which sbt || true
          sbt --version

      - name: Cache sbt and ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/plugins.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build JVM targets (Scala 2.x)
        if: matrix.scala != '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++${{ matrix.scala }} clean miniKanrenJVM/doc coverage miniKanrenJVM/test miniKanrenExamplesJVM/mdoc miniKanrenJVM/coverageReport

      - name: Build Scala 3 JVM modules
        if: matrix.scala == '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 clean miniKanrenJVM/doc miniKanrenJVM/test miniKanrenExamplesJVM/mdoc miniKanrenScala3DSLCrossJVM/test miniKanrenLangCrossJVM/test

      - name: Build and test Scala.js targets
        if: matrix.scala == '3.8.3'
        run: >-
          SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++3.8.3 miniKanrenJS/test miniKanrenExamplesJS/test miniKanrenScala3DSLCrossJS/test miniKanrenLangCrossJS/test miniKanrenWebsite/fullLinkJS

      - name: Upload coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: SBT_OPTS=-Dsbt.server.autostart=false sbt -v ++2.12.21 coveralls

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install sbt via coursier
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fLo "$HOME/.local/bin/cs" https://git.io/coursier-cli
          chmod +x "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$PATH:$HOME/.local/share/coursier/bin"
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
          cs install sbt || ~/.local/bin/cs install sbt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site artifact
        run: bash ./scripts/build-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
