name: CI

on:
  push:
    branches:
      - master
      - cleanup
  pull_request:
    branches:
      - master
      - cleanup
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["2.12.21", "2.13.18", "3.8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install sbt via coursier
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fLo "$HOME/.local/bin/cs" https://git.io/coursier-cli
          chmod +x "$HOME/.local/bin/cs"
          # Make the installed binaries available to subsequent steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Make it available in this step as well
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$PATH:$HOME/.local/share/coursier/bin"
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH
          cs install sbt || ~/.local/bin/cs install sbt

      - name: Verify sbt is available
        run: |
          echo "PATH=$PATH"
          which sbt || true
          sbt --version

      - name: Cache sbt/ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}-jdk-11
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build, test, docs, and mdoc
        run: >-
          sbt -v ++${{ matrix.scala }} clean doc coverage test miniKanrenExamplesJVM/mdoc coverageReport coverageAggregate
      - name: Upload coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: sbt -v ++2.12.21 coveralls
